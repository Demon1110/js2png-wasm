<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>js2png-wasm · 前端代码加密交付演示</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='16' font-family='monospace' font-weight='bold' fill='white' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>js2png-wasm</h1>
      <p class="subtitle">JS 源码 → 加密嵌入 PNG → 浏览器 WASM 解密还原执行，全链路演示</p>
      <div class="status-line">
        <span id="wasm-status" class="badge badge-pending">WASM 加载中…</span>
        <span id="ver-info" class="badge badge-muted"></span>
      </div>
    </div>
  </header>

  <main class="grid">
    <!-- 正向：编码 -->
    <section class="panel">
      <div class="panel-head">
        <h2>① 编码：JS → PNG</h2>
        <span class="hint">交付端使用（CLI 或此处浏览器端）</span>
      </div>
      <textarea id="js-input" spellcheck="false" placeholder="在此粘贴需要加密交付的 JS 源码，或选择 .js 文件"></textarea>
      <div class="row">
        <label class="field">
          <span>加密密钥（可选）</span>
          <input id="enc-key" type="text" placeholder="留空 = 仅压缩不加密" />
        </label>
        <div class="field">
          <span>操作</span>
          <div class="btn-group">
            <button id="btn-encode" class="btn btn-primary">加密生成 PNG</button>
            <button id="btn-load-js" class="btn">选择 .js 文件</button>
          </div>
        </div>
      </div>
      <input id="js-file" type="file" accept=".js,.mjs,.cjs,.txt" hidden />
      <div id="enc-result" class="result" hidden>
        <div class="img-wrap">
          <img id="png-preview" alt="生成的 PNG 预览" />
        </div>
        <div class="result-meta">
          <div id="enc-meta" class="meta-text"></div>
          <a id="btn-download" class="btn btn-primary" download="code.png">下载 PNG</a>
          <span id="enc-error" class="error-text"></span>
        </div>
      </div>
    </section>

    <!-- 反向：解密 -->
    <section class="panel">
      <div class="panel-head">
        <h2>② 解密：PNG → JS</h2>
        <span class="hint">交付端运行（WASM 逻辑）</span>
      </div>
      <div id="drop-zone" class="drop-zone">
        <p>拖拽 PNG 到此处，或点击选择文件</p>
        <input id="png-file" type="file" accept="image/png" hidden />
      </div>
      <div class="row">
        <label class="field">
          <span>解密密钥</span>
          <input id="dec-key" type="text" placeholder="与编码密钥一致；未加密可留空" />
        </label>
        <button id="btn-decode" class="btn btn-primary">解密还原 JS</button>
      </div>
      <div class="row">
        <span id="dec-meta" class="meta-text"></span>
        <span id="dec-error" class="error-text"></span>
      </div>
      <pre id="js-output" class="code-out" hidden><code></code></pre>
      <div class="btn-group">
        <button id="btn-run" class="btn" disabled>▶ 执行解密出的代码</button>
      </div>
      <div id="console-out" class="console" hidden>
        <div class="console-head">运行输出</div>
        <pre id="console-body"></pre>
      </div>
    </section>
  </main>

  <footer class="foot">
    安全提示：这是混淆级交付保护（防静态扫描 / 防爬取），浏览器端代码最终必须明文执行，
    无法对抗有动机的专业逆向；密钥应与 WASM 产物分开部署。
  </footer>

  <script type="module" src="./main.js"></script>
</body>
</html>
