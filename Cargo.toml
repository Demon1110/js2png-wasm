[workspace]
resolver = "2"
members = [
    "crates/js2png-core",
    "crates/js2png-cli",
    "crates/js2png-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/your-org/js2png-wasm"
description = "JS 代码加密嵌入 PNG 图片，支持 WASM 浏览器端反向解密的交付方案"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.js2png-wasm]
opt-level = "s"
codegen-units = 1
